name: Flutter Workflow

on:
  push:

jobs:
  access_repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
  
  install_dart:
    runs-on: ubuntu-latest
    steps:
      - name: install dart
        uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install apt-transport-https gpg
      - run: wget -qO- https://dl-ssl.google.com/linux/linux_signing_key.pub \ | sudo gpg --dearmor -o /usr/share/keyrings/dart.gpg
      - run: echo 'deb [signed-by=/usr/share/keyrings/dart.gpg arch=amd64] https://storage.googleapis.com/download.dartlang.org/linux/debian stable main' \ | sudo tee /etc/apt/sources.list.d/dart_stable.list
      - run: sudo apt-get update && sudo apt-get install dart
      - run: dart --version

  install_flutter:
    runs-on: ubuntu-latest
    needs: [install_dart]
    steps:
      - run: sudo apt-get install -y libglu1-mesa
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: | 
          curl -f https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.0.0-stable.tar.xz > flutter.tar.xz && tar -xf flutter.tar.xz
          echo "`pwd`/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter doctor
      - run: flutter pub get
      - run: flutter build apk
